name: Keepalive

# GitHub disables scheduled workflows on public repos after 60 days with no repository
# activity. Only commits reset that timer -- scheduled runs themselves do not -- so this
# pushes an empty commit monthly to keep the data-sync and training crons alive.

on:
  schedule:
    - cron: '0 5 1 * *'  # 1st of every month at 5 AM UTC

  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Push empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
