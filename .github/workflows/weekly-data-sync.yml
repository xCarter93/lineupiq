name: Weekly Data Sync

on:
  # Run every Wednesday at 8 AM UTC (after Tuesday night games)
  schedule:
    - cron: '0 8 * * 3'  # Wednesday 8 AM UTC = 3 AM EST

  # Manual trigger
  workflow_dispatch:

# A top-level block drops every permission not listed, so contents:read must be explicit
permissions:
  contents: read
  issues: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: packages/backend
        run: uv sync

      # Seasons are resolved inside the script from nflreadpy, not the calendar year:
      # nflverse does not publish a season's stats parquet until Week 1 has finished.
      - name: Fetch latest NFL data
        working-directory: packages/backend
        run: uv run python scripts/sync_data.py

      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfl-data-cache-${{ github.run_number }}
          path: packages/backend/data/raw/
          retention-days: 7

      - name: Create summary
        if: always()
        run: |
          {
            echo "# Data Sync Summary"
            echo ""
            echo "**Date:** $(date)"
            echo ""
            echo "## Cached Files"
            echo '```'
            ls -lhR packages/backend/data/raw/ 2>/dev/null || echo "No files found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Data Sync Failure Report',
              '',
              `**Date:** ${date}`,
              `**Workflow Run:** ${runUrl}`,
              '',
              '### Action Required',
              '1. Check the workflow logs for error details',
              '2. Confirm nflverse has published the expected season parquets',
              '3. Re-run manually if this was a transient network failure',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data Sync Failed - ${date}`,
              body: body,
              labels: ['data-sync', 'automated', 'bug'],
            });
