[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lineupiq"
version = "0.1.0"
description = "Fantasy football prediction ML backend using NFL historical data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "LineupIQ Team" }
]
dependencies = [
    "nflreadpy>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.1.0",
    "optuna>=3.6.0",
    "shap>=0.50.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "mapie>=1.3.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2",
    "requests-cache>=1.2.0",
    # <0.9 pinned: 0.9+ migrates to pyrate-limiter v4, which removed RequestRate (used in weather_cache.py)
    "requests-ratelimiter>=0.8.0,<0.9",
    "python-dotenv>=1.0.0",
    "polars>=1.0.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/lineupiq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "mypy>=1.19.1",
    "httpx>=0.28.1",
]
